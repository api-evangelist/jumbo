name: Jumbo
description: 'Jumbo (Jumbo Privacy) was a consumer privacy and security assistant for iOS and Android,
  founded in 2018 and headquartered in New York, that helped people manage the privacy settings across
  their social media and online accounts, clean up old posts, and monitor for data breaches. By design
  the app processed everything on-device and did not rely on server-side APIs to control user accounts,
  so it never exposed a public developer platform, OpenAPI specification, or SDK. Jumbo was acquired by
  Coalition, the B2B cyber insurer, in July 2023 and the consumer app has since been shut down. This
  API Evangelist profile is retained as a portfolio-company record for index-ventures; no API surface
  exists to enrich.'
